version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sushi
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  mock:
    build: ./mock-server
    command: npm start
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sushi
    depends_on:
      - db

volumes:
  db_data:
