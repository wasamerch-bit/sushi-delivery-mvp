name: CI
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install
        run: |
          cd mock-server
          npm ci
      - name: Run mock server tests (smoke)
        run: |
          # Start server in background
          cd mock-server
          npm start & sleep 2
          curl --fail http://localhost:3000/dashboard/overview
